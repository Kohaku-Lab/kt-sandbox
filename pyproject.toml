[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt-sandbox"
version = "0.1.0.dev0"
description = "Persistent Docker sandboxes with an MCP server inside, plus a manager to open, save and lock them down."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
manager = ["docker>=7", "pyyaml>=6"]
server = ["kohakuterrarium>=2.2.0,<3"]
dev = [
    "black",
    "docker>=7",
    "kohakuterrarium>=2.2.0,<3",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6",
    "ruff",
]

[project.scripts]
kt-sandbox = "kt_sandbox.cli:main"
kt-sandbox-mcp = "kt_sandbox.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kt_sandbox"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["F401", "F841", "PLW1514"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running Docker engine (set KT_SANDBOX_LIVE=1)"]
