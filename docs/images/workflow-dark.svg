<svg xmlns="http://www.w3.org/2000/svg" width="830" height="342" viewBox="0 0 830 342" role="img">
<title>Set a sandbox up with everything open, save it, and reopen the same state locked down</title>
<defs><marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="ht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="ho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect width="830" height="342" fill="#0d1117"/>
<rect x="16" y="10" width="798" height="322" rx="4" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="30" y="32" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">set it up open, lock it down later</text>
<text x="30" y="92" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">state</text>
<text x="30" y="108" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="start" xml:space="preserve">(in the image)</text>
<text x="30" y="232" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">policy</text>
<text x="30" y="248" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="start" xml:space="preserve">(the level)</text>
<rect x="150" y="48" width="150" height="104" rx="5" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
<text x="225.0" y="86.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">base image</text>
<text x="225.0" y="104.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">python, curl, sudo</text>
<text x="225.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">kt-sandbox build</text>
<rect x="316" y="48" width="150" height="104" rx="5" fill="#6b3a14" stroke="#f0883e" stroke-width="1"/>
<text x="391.0" y="77.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">your setup</text>
<text x="391.0" y="95.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">packages, files, dotfiles</text>
<text x="391.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">up lab --level open</text>
<text x="391.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">connect lab</text>
<rect x="482" y="48" width="150" height="104" rx="5" fill="#1d4b99" stroke="#4493f8" stroke-width="1"/>
<text x="557.0" y="86.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">saved image</text>
<text x="557.0" y="104.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">lab-image</text>
<text x="557.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">save lab lab-image</text>
<rect x="648" y="48" width="150" height="104" rx="5" fill="#1d4b99" stroke="#4493f8" stroke-width="1"/>
<text x="723.0" y="77.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">same state</text>
<text x="723.0" y="95.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">in a new sandbox</text>
<text x="723.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">up bot --level strict</text>
<text x="723.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">--from lab-image</text>
<line x1="300" y1="100" x2="316" y2="100" stroke="#6e7681" stroke-width="1.5" marker-end="url(#hg)"/>
<line x1="466" y1="100" x2="482" y2="100" stroke="#6e7681" stroke-width="1.5" marker-end="url(#hg)"/>
<line x1="632" y1="100" x2="648" y2="100" stroke="#6e7681" stroke-width="1.5" marker-end="url(#hg)"/>
<line x1="474" y1="36" x2="474" y2="296" stroke="#3d444d" stroke-width="1" stroke-dasharray="5 4"/>
<text x="474" y="30" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">save</text>
<rect x="150" y="192" width="316" height="88" rx="5" fill="#6b3a14" stroke="#f0883e" stroke-width="1"/>
<text x="308" y="220" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">open</text>
<text x="308" y="240" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">network · sudo · 2 CPUs · 300 s a command</text>
<text x="308" y="260" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">to install and try things</text>
<rect x="482" y="192" width="316" height="88" rx="5" fill="#14555a" stroke="#39c5cf" stroke-width="1"/>
<text x="640" y="220" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" xml:space="preserve">strict</text>
<text x="640" y="240" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">no network · no sudo · 0.5 CPU · 15 s a command</text>
<text x="640" y="260" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="middle" xml:space="preserve">for an agent anyone can steer</text>
<text x="30" y="316" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1" text-anchor="start" xml:space="preserve">The level is set when a sandbox is created; to change it, save and open the image as a new sandbox.</text>
</svg>
