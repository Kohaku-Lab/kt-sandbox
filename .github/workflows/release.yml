name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {tag: slim, extras: ""}
          - {tag: data, extras: "data"}
          - {tag: render, extras: "data,render"}
          - {tag: dev, extras: "data,dev"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -e .
      - name: Build and push ${{ matrix.tag }} for amd64 and arm64
        run: |
          kt-sandbox build \
            --extras "${{ matrix.extras }}" \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/kohaku-lab/kt-sandbox:${{ matrix.tag }}
          kt-sandbox build \
            --extras "${{ matrix.extras }}" \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/kohaku-lab/kt-sandbox:${{ matrix.tag }}-${{ github.ref_name }}
